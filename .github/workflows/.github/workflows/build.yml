
name: Build Marin Xit APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MarinXit_Android_Studio_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -o MarinXit_Android_Studio_Project.zip

      - name: Compilar APK
        run: gradle -p MarinXitAndroid assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Marin-Xit-APK
          path: MarinXitAndroid/app/build/outputs/apk/debug/app-debug.apk
