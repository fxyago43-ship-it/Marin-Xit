
name: Build Marin Xit APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: unzip -o MarinXit_Android_Studio_Project.zip -d projeto

      - name: Verificar arquivos
        run: find projeto -maxdepth 3 -type f | head -80

      - name: Compilar APK
        run: gradle -p projeto/MarinXitAndroid assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Marin-Xit-APK
          path: projeto/MarinXitAndroid/app/build/outputs/apk/debug/app-debug.apk
